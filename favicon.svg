<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27" />
      <stop offset="50%" stop-color="#141a45" />
      <stop offset="100%" stop-color="#060919" />
    </linearGradient>

    <!-- Golden Ring Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7" />
      <stop offset="40%" stop-color="#ffd56b" />
      <stop offset="70%" stop-color="#d69e2e" />
      <stop offset="100%" stop-color="#ffeaa7" />
    </linearGradient>

    <!-- Luminous Full Moon Gradient -->
    <radialGradient id="moonGlow" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff8d1" />
      <stop offset="65%" stop-color="#ffd255" />
      <stop offset="90%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <!-- Red Lantern Gradient -->
    <linearGradient id="lanternGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7675" />
      <stop offset="40%" stop-color="#d63031" />
      <stop offset="100%" stop-color="#b71540" />
    </linearGradient>

    <!-- Lantern Core Flame Glow -->
    <radialGradient id="lanternFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#ffeaa7" />
      <stop offset="80%" stop-color="#ff7675" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d63031" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Circular Night Sky Badge -->
  <circle cx="64" cy="64" r="61" fill="url(#nightSky)" stroke="url(#goldBorder)" stroke-width="3" />

  <!-- 2. Ambient Lunar Aura -->
  <circle cx="56" cy="60" r="42" fill="#ffd56b" opacity="0.2" filter="url(#softGlow)" />

  <!-- 3. Luminous Full Moon -->
  <circle cx="56" cy="60" r="34" fill="url(#moonGlow)" />

  <!-- Subtle Lunar Crater Details -->
  <circle cx="44" cy="50" r="6" fill="#f59e0b" opacity="0.22" />
  <circle cx="68" cy="68" r="8" fill="#f59e0b" opacity="0.18" />
  <circle cx="66" cy="46" r="4.5" fill="#f59e0b" opacity="0.16" />

  <!-- 4. Auspicious Celestial Cloud (Mây Tường Vân Cung Trăng) -->
  <path d="M 22,76 C 22,66 34,60 44,68 C 50,56 68,58 74,68 C 84,60 100,64 102,76 C 104,86 92,92 78,91 C 55,92 35,90 22,76 Z" 
        fill="#ffffff" opacity="0.28" />
  <path d="M 28,78 Q 42,70 58,74 T 88,72 Q 98,78 90,84 Q 64,88 38,82 Z" 
        fill="#ffeaa7" opacity="0.5" />

  <!-- 5. Cute White Jade Rabbit Silhouette (Thỏ Ngọc Ngắm Trăng) -->
  <g transform="translate(42, 42)">
    <!-- Rabbit Body -->
    <ellipse cx="18" cy="30" rx="11" ry="9" fill="#ffffff" />
    <!-- Rabbit Head -->
    <circle cx="12" cy="20" r="7.5" fill="#ffffff" />
    <!-- Rabbit Ears -->
    <path d="M 10,14 C 8,7 10,2 12,2 C 14,2 14,7 13,14 Z" fill="#ffffff" />
    <path d="M 11,13 C 10,8 11,4 12,4 C 13,4 13,8 12.5,13 Z" fill="#ffb8b8" opacity="0.65" />
    <path d="M 14,15 C 15,9 18,5 20,6 C 21,7 19,11 16,15 Z" fill="#ffffff" />
    <path d="M 15,14 C 16,10 18,7 19,8 C 19.5,9 18.5,12 16.5,14 Z" fill="#ffb8b8" opacity="0.65" />
    <!-- Rabbit Tail -->
    <circle cx="28" cy="31" r="3.5" fill="#ffffff" />
    <!-- Cute Pink Eye -->
    <circle cx="9.5" cy="19.5" r="1.2" fill="#ee5253" />
    <!-- Golden Paw Accent -->
    <ellipse cx="12" cy="36" rx="4" ry="2" fill="#ffffff" />
    <ellipse cx="20" cy="36" rx="4" ry="2" fill="#ffffff" />
  </g>

  <!-- 6. Mid-Autumn Traditional Red & Gold Lantern (Đèn Lồng Khổng Minh) -->
  <g transform="translate(86, 20)">
    <!-- Hanging String -->
    <line x1="14" y1="0" x2="14" y2="8" stroke="#ffd56b" stroke-width="1.5" />
    <!-- Top Cap -->
    <polygon points="8,8 20,8 18,11 10,11" fill="#ffd56b" />
    <!-- Lantern Core Body -->
    <path d="M 10,11 Q 4,20 10,29 L 18,29 Q 24,20 18,11 Z" fill="url(#lanternGrad)" stroke="#ffd56b" stroke-width="0.8" />
    <!-- Lantern Inner Flame Glow -->
    <circle cx="14" cy="20" r="5" fill="url(#lanternFlame)" />
    <!-- Golden Ribs -->
    <path d="M 14,11 L 14,29 M 11,11 Q 9,20 11,29 M 17,11 Q 19,20 17,29" fill="none" stroke="#ffd56b" stroke-width="0.7" opacity="0.75" />
    <!-- Bottom Cap -->
    <polygon points="10,29 18,29 17,32 11,32" fill="#ffd56b" />
    <!-- Tassel Ring & Golden Tassel -->
    <circle cx="14" cy="33.5" r="1.2" fill="#ffd56b" />
    <path d="M 14,35 L 14,44 M 12.5,35 L 12,43 M 15.5,35 L 16,43" stroke="#ff7675" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- 7. Twinkling Golden Starbursts (Bụi Sao Lấp Lánh) -->
  <!-- Star 1 (Top Left) -->
  <g transform="translate(24, 24)">
    <path d="M 0,-5 Q 0,0 5,0 Q 0,0 0,5 Q 0,0 -5,0 Q 0,0 0,-5 Z" fill="#ffd56b" />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
  </g>
  <!-- Star 2 (Center Left) -->
  <circle cx="18" cy="48" r="1.8" fill="#ffeaa7" opacity="0.85" />
  <!-- Star 3 (Bottom Right) -->
  <g transform="translate(98, 80)">
    <path d="M 0,-4 Q 0,0 4,0 Q 0,0 0,4 Q 0,0 -4,0 Q 0,0 0,-4 Z" fill="#ffd56b" />
    <circle cx="0" cy="0" r="1.2" fill="#ffffff" />
  </g>
  <circle cx="86" cy="94" r="1.5" fill="#ffffff" opacity="0.9" />
  <!-- Tiny Stardust -->
  <circle cx="36" cy="20" r="1" fill="#ffffff" opacity="0.7" />
  <circle cx="76" cy="18" r="1.2" fill="#ffd56b" opacity="0.8" />
</svg>
